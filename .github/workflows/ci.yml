name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

      # A build proves the types line up; it does not prove Tailwind emitted the
      # design system. These four are the load-bearing pieces of the skin.
      - name: Check the stylesheet compiled
        run: |
          set -e
          css=$(cat .next/static/css/*.css)
          for token in --room .sticker .tx-word .dock; do
            case "$css" in
              *"$token"*) echo "ok $token" ;;
              *) echo "missing from the compiled CSS: $token" >&2; exit 1 ;;
            esac
          done
